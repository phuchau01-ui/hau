<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="베트남에 대한 인식과 경험 설문조사">
<title>설문 공유하기 | Korea × Vietnam</title>
<link rel="stylesheet" href="styles.css">
<style>
.share-page{max-width:720px;margin:8vh auto;padding:0 18px}
.share-card{text-align:center;padding:clamp(26px,6vw,52px)}
.share-mark{font-size:12px;letter-spacing:3px;color:var(--coral);font-weight:700}
.share-card h1{font-family:'Noto Sans KR',sans-serif;font-size:clamp(26px,5vw,38px);line-height:1.35;margin:18px 0}
.share-card p{color:var(--muted);margin:0 auto 24px;max-width:520px}
.share-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:22px 0}
.share-buttons>*{min-width:140px}
.share-note{font-size:12px;color:var(--muted);margin-top:20px}
</style>
</head>
<body>
<main class="share-page">
<section class="panel share-card" lang="ko">
<div class="share-mark">SURVEY · KOREA × VIETNAM</div>
<h1>친구에게 설문을 공유해 주세요</h1>
<p>베트남에 대한 인식과 경험을 알아보는 설문조사입니다. 여러분의 참여와 의견은 연구에 큰 도움이 됩니다.</p>
<div class="share-buttons">
<a class="btn primary" id="startSurvey" href="./index.html?lang=ko">설문 참여하기</a>
<a class="btn secondary" id="kakaoShare" href="#" target="_blank" rel="noopener">KakaoTalk</a>
<a class="btn secondary" id="facebookShare" href="#" target="_blank" rel="noopener">Facebook</a>
<a class="btn secondary" id="messengerShare" href="#">Messenger</a>
<button class="btn secondary" id="copyLink" type="button">링크 복사하기</button>
</div>
<p class="share-note" id="shareStatus" role="status">설문 링크를 친구에게 전달해 주세요.</p>
</section>
<footer><a href="./index.html?lang=ko">설문으로 돌아가기</a></footer>
</main>
<script>
(function(){
 const surveyUrl=new URL('./index.html?lang=ko',window.location.href).href;
 const pageUrl=window.location.href;
 const title='베트남 설문조사';
 const message='베트남에 대한 인식과 경험을 알아보는 설문조사에 참여해 주세요.';
 document.getElementById('startSurvey').href=surveyUrl;
 document.getElementById('kakaoShare').href='https://sharer.kakao.com/talk/friends/picker/link?url='+encodeURIComponent(surveyUrl)+'&text='+encodeURIComponent(message);
 document.getElementById('facebookShare').href='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(surveyUrl);
 document.getElementById('messengerShare').href='fb-messenger://share/?link='+encodeURIComponent(surveyUrl);
 document.getElementById('copyLink').addEventListener('click',async function(){
   const status=document.getElementById('shareStatus');
   try{await navigator.clipboard.writeText(surveyUrl);status.textContent='설문 링크가 복사되었습니다.';}
   catch(e){window.prompt('설문 링크를 복사하세요',surveyUrl);}
 });
})();
</script>
</body>
</html>
